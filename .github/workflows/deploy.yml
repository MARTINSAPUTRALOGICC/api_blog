name: Deploy Go

on:
push:
branches:
- main

jobs:
deploy:
runs-on:
- self-hosted
- spb-running


steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Create ENV
    run: |
      echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

  - name: Build Docker Image
    run: |
      docker build -t api_blog:latest .

  - name: Stop Old Container
    run: |
      docker rm -f api_blog || true

  - name: Run Container
    run: |
      docker run -d \
        --name api_blog \
        --restart always \
        --env-file .env \
        -p 8080:8080 \
        api_blog:latest

  - name: Check Container
    run: |
      docker ps -a
      docker logs --tail 100 api_blog || true
